<!DOCTYPE html>
<!-- Карточка-превью для ссылок (docs/img/og.jpg, 1200x630) и значок сайта. Пересобрать: node tools/make-assets.js -->
<html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;background:#07080b;overflow:hidden}
body{font-family:Inter,"DejaVu Sans",sans-serif;color:#e9e6df;position:relative}
.bg{position:absolute;top:-20px;bottom:-20px;left:420px;right:-160px;background:url(../../docs/img/nova-wallpaper.jpg) center/cover;opacity:.95}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,#07080b 0%,#07080b 36%,rgba(7,8,11,.6) 56%,rgba(7,8,11,0) 75%)}
.wrap{position:absolute;left:72px;top:64px;right:72px;bottom:56px;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:14px;font:700 30px/1 "Inter Display",Inter,sans-serif;letter-spacing:.12em}
.logo img{width:54px;height:54px}
.logo small{font:500 20px/1 "DejaVu Sans Mono",monospace;color:#8b8f99;letter-spacing:.05em;margin-left:4px}
.tag{margin-top:46px;font:500 21px/1 "DejaVu Sans Mono",monospace;color:#f5b54a}
h1{margin-top:22px;font:800 86px/1.02 "Inter Display",Inter,sans-serif;letter-spacing:-.02em}
h1 span{color:#f5b54a}
.chips{margin-top:auto;display:flex;flex-wrap:wrap;gap:12px;max-width:820px}
.chip{font:500 21px/1 Inter,sans-serif;padding:12px 18px;border:1px solid #2b303c;border-radius:8px;background:rgba(13,15,20,.82)}
.chip b{color:#7bd88f;font-weight:700;margin-right:8px}
</style></head><body>
<div class="bg"></div><div class="shade"></div>
<div class="wrap">
  <div class="logo"><img src="../../docs/img/favicon.svg">NOVA<small id="ver">v0.5</small></div>
  <div class="tag">// бесплатно · открытый код · Windows 10/11</div>
  <h1>Твоя Windows.<br><span>Без лишнего.</span></h1>
  <div class="chips">
    <div class="chip"><b>✓</b>без рекламы и слежки</div>
    <div class="chip"><b>✓</b>готовность к играм</div>
    <div class="chip"><b>✓</b>голос «Нова, …»</div>
    <div class="chip"><b>✓</b>отмена в один клик</div>
  </div>
</div>
<script>
  var v = new URLSearchParams(location.search).get('v');
  if (v && /^\d+\.\d+$/.test(v)) document.getElementById('ver').textContent = 'v' + v;
  document.fonts.ready.then(function () { document.title = 'ready'; });
</script>
</body></html>
