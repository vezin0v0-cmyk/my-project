name: Скриншоты до и после

on:
  push:
    paths:
      - 'src/**'
      - 'config.json'
      - 'tests/Take-Screenshots.ps1'
      - 'assets/**'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    name: Снимки экрана Windows
    runs-on: windows-latest
    env:
      # Рабочая папка GitHub открыта для всех пользователей машины; на настоящем ПК Nova такую папку не примет.
      NOVA_ALLOW_SHARED_FOLDER: '1'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Разрешение экрана 1920x1080
        shell: powershell
        continue-on-error: true
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: Снимки до Nova
        shell: powershell
        run: ./tests/Take-Screenshots.ps1 -Prefix before

      - name: Применить Nova
        shell: powershell
        run: ./src/Nova.ps1 -Mode Apply -Yes -NoRestorePoint

      - name: Снимки после Nova
        shell: powershell
        run: ./tests/Take-Screenshots.ps1 -Prefix after

      - name: Снимки Nova Центра
        shell: powershell
        run: ./src/NovaApp.ps1 -Screenshot (Join-Path (Get-Location) 'screenshots')

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nova-screenshots
          path: screenshots/
          retention-days: 14

      - name: Миниатюра Nova Центра в журнал (главная и ход работы)
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          $files = @('nova-center-01-glavnaya.png', 'nova-center-09-hod-raboty.png')
          $w = 640; $h = 400
          $sheet = New-Object System.Drawing.Bitmap -ArgumentList $w, ($h * $files.Count)
          $g = [System.Drawing.Graphics]::FromImage($sheet)
          $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
          for ($i = 0; $i -lt $files.Count; $i++) {
            $img = [System.Drawing.Image]::FromFile((Join-Path (Get-Location) ('screenshots\' + $files[$i])))
            $g.DrawImage($img, 0, $i * $h, $w, $h); $img.Dispose()
          }
          $codec = [System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object { $_.MimeType -eq 'image/jpeg' }
          $ep = New-Object System.Drawing.Imaging.EncoderParameters 1
          $ep.Param[0] = New-Object System.Drawing.Imaging.EncoderParameter ([System.Drawing.Imaging.Encoder]::Quality), 55L
          $ms = New-Object IO.MemoryStream
          $sheet.Save($ms, $codec, $ep)
          $b64 = [Convert]::ToBase64String($ms.ToArray())
          "B64LEN $($b64.Length)"
          for ($k = 0; $k -lt $b64.Length; $k += 8000) { 'B64 ' + $b64.Substring($k, [math]::Min(8000, $b64.Length - $k)) }
