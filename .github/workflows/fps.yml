name: Замер FPS (PresentMon)

on:
  push:
    paths:
      - 'src/**'
      - 'tests/Test-Fps.ps1'
      - '.github/workflows/fps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fps:
    name: PresentMon на Windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Only ASCII in run blocks: GitHub saves them without BOM, Windows PowerShell 5.1 would misread Cyrillic.
      - name: PresentMon release info
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ 'User-Agent' = 'nova-ci'; Authorization = "Bearer $env:GH_TOKEN" }
          $releases = Invoke-RestMethod 'https://api.github.com/repos/GameTechDev/PresentMon/releases?per_page=5' -Headers $headers
          foreach ($rel in $releases) {
            Write-Host ('== {0} prerelease={1} published={2}' -f $rel.tag_name, $rel.prerelease, $rel.published_at)
            foreach ($a in $rel.assets) { Write-Host ('   {0}  {1}  {2}' -f $a.name, $a.size, $a.digest) }
          }
          $rel = $releases | Where-Object { -not $_.prerelease } | Select-Object -First 1
          $asset = $rel.assets | Where-Object { $_.name -match '^PresentMon-[\d\.]+-x64\.exe$' } | Select-Object -First 1
          Write-Host ('Chosen: {0}' -f $asset.browser_download_url)
          Invoke-WebRequest $asset.browser_download_url -OutFile "$env:RUNNER_TEMP\pm.exe"
          Write-Host ('SHA256: {0}' -f (Get-FileHash "$env:RUNNER_TEMP\pm.exe" -Algorithm SHA256).Hash)
          & "$env:RUNNER_TEMP\pm.exe" --help 2>&1 | Select-Object -First 120 | ForEach-Object { Write-Host $_ }

      - name: Capture frames from an animated browser window
        shell: pwsh
        run: |
          $html = Join-Path $env:RUNNER_TEMP 'spin.html'
          Set-Content -LiteralPath $html -Encoding utf8 -Value '<!doctype html><canvas id=c width=800 height=600></canvas><script>const c=document.getElementById("c").getContext("2d");let a=0;(function f(){a+=0.05;c.fillStyle="#123";c.fillRect(0,0,800,600);c.fillStyle="#fc4";c.save();c.translate(400,300);c.rotate(a);c.fillRect(-120,-120,240,240);c.restore();requestAnimationFrame(f);})();</script>'
          $edge = 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
          $p = Start-Process -FilePath $edge -ArgumentList @('--new-window', '--no-first-run', "--user-data-dir=$env:RUNNER_TEMP\edge", "file:///$($html -replace '\\','/')") -PassThru
          Start-Sleep -Seconds 8
          $csv = Join-Path $env:RUNNER_TEMP 'pm.csv'
          & "$env:RUNNER_TEMP\pm.exe" --output_file $csv --timed 10 --terminate_after_timed --stop_existing_session --no_console_stats 2>&1 | ForEach-Object { Write-Host $_ }
          Write-Host ('exit: {0}' -f $LASTEXITCODE)
          if (Test-Path $csv) {
            $lines = Get-Content $csv
            Write-Host ('rows: {0}' -f $lines.Count)
            $lines | Select-Object -First 4 | ForEach-Object { Write-Host $_ }
            $data = Import-Csv $csv
            $data | Group-Object Application | Sort-Object Count -Descending | Select-Object -First 8 | ForEach-Object { Write-Host ('{0}: {1}' -f $_.Name, $_.Count) }
          } else {
            Write-Host 'no csv'
            Get-ChildItem $env:RUNNER_TEMP -Filter 'pm*' | ForEach-Object { Write-Host $_.FullName }
          }
          Stop-Process -Name msedge -Force -ErrorAction SilentlyContinue
