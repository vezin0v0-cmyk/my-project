name: Проверка сайта

on:
  push:
    paths:
      - 'docs/**'
      - 'tests/site/**'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'tests/site/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    name: Сайт и кабинет в браузере
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: tests/site
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # Версия Playwright закреплена в package-lock.json вместе с контрольными суммами.
      - name: Install Playwright and Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium

      # Supabase имитируется внутри проверок: настоящий сервер и почта не трогаются.
      - name: Run site checks
        env:
          NOVA_SHOTS: ${{ runner.temp }}/site-shots
        run: node run-all.js

      - name: Screenshots on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-shots
          path: ${{ runner.temp }}/site-shots
          retention-days: 7
