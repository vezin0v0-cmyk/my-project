name: Голосовые команды (Vosk)

on:
  push:
    paths:
      - 'src/**'
      - 'voice.json'
      - 'tests/Test-Voice.ps1'
      - 'tests/voice/**'
      - '.github/workflows/voice.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voice:
    name: Vosk на Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # Only ASCII in run blocks: GitHub saves them without BOM, Windows PowerShell 5.1 would misread Cyrillic.
      - name: Discover Vosk engine hash and files
        shell: pwsh
        run: |
          $url = 'https://github.com/alphacep/vosk-api/releases/download/v0.3.45/vosk-win64-0.3.45.zip'
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP\vosk.zip"
          Write-Host ('ENGINE size={0} sha256={1}' -f (Get-Item "$env:RUNNER_TEMP\vosk.zip").Length, (Get-FileHash "$env:RUNNER_TEMP\vosk.zip" -Algorithm SHA256).Hash)
          Expand-Archive "$env:RUNNER_TEMP\vosk.zip" -DestinationPath "$env:RUNNER_TEMP\vosk" -Force
          Get-ChildItem "$env:RUNNER_TEMP\vosk" -Recurse | ForEach-Object { Write-Host ('{0}  {1}' -f $_.FullName, $_.Length) }
