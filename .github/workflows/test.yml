name: Проверка Nova

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Тесты на Windows
    runs-on: windows-latest
    env:
      # Рабочая папка GitHub открыта для всех пользователей машины; на настоящем ПК Nova такую папку не примет.
      NOVA_ALLOW_SHARED_FOLDER: '1'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Файл сводки
        shell: pwsh
        run: Add-Content -LiteralPath $env:GITHUB_ENV -Value ('NOVA_SUMMARY=' + (Join-Path $env:RUNNER_TEMP 'nova-summary.txt'))

      - name: Конструктор на сайте совпадает с программой
        shell: pwsh
        run: python tools/sync-site-data.py --check

      - name: Синтаксис, кодировка и стиль кода
        shell: pwsh
        run: ./tests/Lint.ps1

      - name: Применить всё и отменить (проверка, что система возвращается как было)
        shell: powershell
        run: ./tests/Test-Nova.ps1

      - name: Расчёты замера FPS
        shell: powershell
        run: ./tests/Test-Fps.ps1

      - name: Очистка диска не ходит по подложенным ссылкам
        shell: powershell
        run: ./tests/Test-Clean.ps1

      - name: Готовность к играм (видеокарта, монитор, память, диск)
        shell: powershell
        run: ./tests/Test-Game.ps1

      - name: Автозагрузка (выключатель как в Диспетчере задач)
        shell: powershell
        run: |
          ./tests/Test-Startup.ps1
          ./src/Nova.ps1 -Mode Startup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Голос вместе с Windows (окно настройки, без меню)
        shell: powershell
        run: |
          $lua = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System').EnableLUA
          if ($lua -ne 0) { Write-Host '::warning::UAC is on: voice refuses to run elevated, autostart window not checked'; exit 0 }
          $link = Join-Path ([Environment]::GetFolderPath('Startup')) 'Nova Voice.lnk'
          ./src/NovaVoice.ps1 -Startup -Yes
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $link)) { throw 'voice autostart was not turned on' }
          ./src/NovaVoice.ps1 -Startup -Yes
          if ($LASTEXITCODE -ne 0 -or (Test-Path -LiteralPath $link)) { throw 'voice autostart was not turned off' }

      - name: Переезд на чистую Windows (список программ с флешки не доверенный)
        shell: powershell
        run: ./tests/Test-Move.ps1

      - name: Обновление (список изменений, установка из архива, злые архивы и откат)
        shell: powershell
        run: |
          ./tests/Test-Update.ps1
          ./src/Nova.ps1 -Mode Update
          if ($LASTEXITCODE -eq 2) { Write-Host '::warning::GitHub is not reachable, update check skipped'; exit 0 } elseif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Что тормозит, интернет для игр, отчёт для поддержки
        shell: powershell
        run: |
          ./tests/Test-Tools.ps1
          ./src/Nova.ps1 -Mode Heavy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./src/Nova.ps1 -Mode Net
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./src/Nova.ps1 -Mode Report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-ChildItem -LiteralPath ([Environment]::GetFolderPath('Desktop')) -Filter 'Nova*.txt' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $report) { throw 'No support report on the desktop.' }
          Get-Content -LiteralPath $report.FullName -Encoding UTF8 | Select-Object -First 12

      - name: Режим игры и игры для голоса (включить и вернуть как было)
        shell: powershell
        run: |
          ./tests/Test-Play.ps1
          ./src/Nova.ps1 -Mode Game
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Get-ItemProperty -Path 'HKCU:\Software\Nova' -Name GameMode -ErrorAction SilentlyContinue)) { throw 'Game mode did not turn on.' }
          ./src/Nova.ps1 -Mode Game
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Get-ItemProperty -Path 'HKCU:\Software\Nova' -Name GameMode -ErrorAction SilentlyContinue) { throw 'Game mode did not turn off.' }
          if (Test-Path -LiteralPath (Join-Path $env:ProgramData 'Nova\gamemode-updates.json')) { throw 'Update pause was not lifted.' }

      - name: Свежий ли драйвер видеокарты
        shell: powershell
        run: ./src/Nova.ps1 -Mode Driver

      - name: Освободить место (без долгого DISM)
        shell: powershell
        run: ./src/Nova.ps1 -Mode Clean -Yes -Quick

      - name: Проверка системы
        shell: powershell
        run: ./src/Nova.ps1 -Mode Check

      - name: Nova.cmd из папки со сложным именем и без распаковки
        shell: powershell
        # Only ASCII inside: GitHub saves this script without BOM, and Windows PowerShell 5.1 would misread Cyrillic.
        run: |
          function Invoke-Cmd([string]$Path, [string]$InputText) {
            $in = Join-Path $env:RUNNER_TEMP 'cmd-in.txt'
            $out = Join-Path $env:RUNNER_TEMP 'cmd-out.txt'
            Set-Content -LiteralPath $in -Value $InputText -Encoding Ascii
            # This is how Explorer runs a .cmd on double click: cmd /c ""path"".
            $p = Start-Process -FilePath cmd.exe -ArgumentList ('/c ""{0}""' -f $Path) -RedirectStandardInput $in -RedirectStandardOutput $out -NoNewWindow -PassThru
            if (-not $p.WaitForExit(180000)) { & taskkill.exe /T /F /PID $p.Id | Out-Null; throw "Nova.cmd hung: $Path" }
            $text = Get-Content -LiteralPath $out -Raw
            Write-Host $text
            return $text
          }
          $dir = Join-Path $env:RUNNER_TEMP "Vadim's Nova & Co (1)"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          foreach ($item in @('Nova.cmd', 'config.json', 'src', 'assets')) { Copy-Item -Path $item -Destination $dir -Recurse -Force }
          $menu = Invoke-Cmd (Join-Path $dir 'Nova.cmd') '0'
          if ($menu -notmatch 'Nova 0\.\d') { throw 'Nova menu did not open from a folder with a tricky name.' }
          $lonely = Join-Path $env:RUNNER_TEMP 'only-cmd'
          New-Item -ItemType Directory -Path $lonely -Force | Out-Null
          Copy-Item -Path 'Nova.cmd' -Destination $lonely
          $hint = Invoke-Cmd (Join-Path $lonely 'Nova.cmd') ''
          if ($hint -notmatch 'Nova\.cmd') { throw 'Nova.cmd alone did not ask to unpack the archive.' }

      - name: Режим просмотра
        shell: powershell
        run: ./src/Nova.ps1 -Mode Preview

      - name: Замер, применение, замер и отмена через меню-команды
        shell: powershell
        run: |
          ./src/Nova.ps1 -Mode Measure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./src/Nova.ps1 -Mode Apply -Yes -NoRestorePoint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Start-Sleep -Seconds 20
          ./src/Nova.ps1 -Mode Measure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./src/Nova.ps1 -Mode Undo -Yes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Nova Центр (окно открывается, все страницы рисуются)
        shell: powershell
        run: |
          $shots = Join-Path $env:RUNNER_TEMP 'nova-center'
          ./src/NovaApp.ps1 -Screenshot $shots
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = @(Get-ChildItem -LiteralPath $shots -Filter '*.png')
          $files | ForEach-Object { '{0}  {1:N0} bytes' -f $_.Name, $_.Length }
          if ($files.Count -lt 9) { throw 'Not every page of Nova Center was drawn.' }
          # The window shows Nova's output through an echo file in the admin-only build folder.
          $echo = Join-Path $env:ProgramData ('Nova\build\app-run-{0}.log' -f [DateTime]::UtcNow.Ticks)
          ./src/Nova.ps1 -Mode Driver -EchoFile $echo
          $lines = @(Get-Content -LiteralPath $echo -Encoding UTF8)
          "echo lines: $($lines.Count)"; $lines | Select-Object -First 6
          if ($lines.Count -lt 2 -or $lines[0] -notmatch "^\w+`t") { throw 'Echo for Nova Center is empty or has no colors.' }
          if (@($lines | Where-Object { $_ -like '*_____*' }).Count) { throw 'The console banner went into the Nova Center echo.' }
          $evil = Join-Path $env:RUNNER_TEMP 'app-run-1.log'
          ./src/Nova.ps1 -Mode Driver -EchoFile $evil
          if (Test-Path -LiteralPath $evil) { throw 'Echo went outside the Nova build folder.' }

      - name: Nova Центр как у пользователя (кнопки в окне нажимаются по-настоящему)
        shell: powershell
        run: ./tests/Test-Center.ps1

      - name: Как у пользователя — скачать с сайта, распаковать, пройти меню
        shell: powershell
        # Only ASCII inside: GitHub saves this script without BOM, and Windows PowerShell 5.1 would misread Cyrillic.
        run: |
          # 1. The download link exactly as the site has it (docs/index.html -> LINKS.download).
          $page = Get-Content -LiteralPath 'docs/index.html' -Raw -Encoding UTF8
          if ($page -notmatch "download:\s*'(https://github\.com/[^']+\.zip)'") { throw 'No download link on the site.' }
          $url = $Matches[1]
          Write-Host "download link: $url"
          $zip = Join-Path $env:RUNNER_TEMP 'nova-download.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Write-Host ('downloaded {0:N0} bytes' -f (Get-Item -LiteralPath $zip).Length)
          # 2. Unpack like a user would, even without 'Unblock' (the internet mark stays on every file).
          Set-Content -LiteralPath $zip -Stream 'Zone.Identifier' -Value "[ZoneTransfer]`r`nZoneId=3"
          $dir = Join-Path $env:RUNNER_TEMP 'user-download'
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          $root = (Get-ChildItem -LiteralPath $dir -Directory | Select-Object -First 1).FullName
          foreach ($f in @('Nova.cmd', 'NovaCenter.cmd', 'src\NovaApp.ps1', 'assets\nova.ico', 'NovaVoice.cmd', 'config.json', 'voice.json', 'CHANGELOG.md', 'src\Nova.ps1', 'src\Nova.psm1', 'src\NovaPlay.psm1', 'src\NovaTools.psm1', 'src\NovaVoiceStartup.cmd', 'assets')) {
            if (-not (Test-Path -LiteralPath (Join-Path $root $f))) { throw "Missing in the download: $f" }
          }
          $mine = [regex]::Match((Get-Content -LiteralPath 'src/Nova.psm1' -Raw), "NovaVersion = '([0-9.]+)'").Groups[1].Value
          $theirs = [regex]::Match((Get-Content -LiteralPath (Join-Path $root 'src\Nova.psm1') -Raw), "NovaVersion = '([0-9.]+)'").Groups[1].Value
          Write-Host "version in the download: $theirs (repo: $mine)"
          if (-not $theirs) { throw 'No version in the download.' }
          # 3. Walk the menu through Nova.cmd: game mode on, off, driver, what slows down, update check, exit.
          $in = Join-Path $env:RUNNER_TEMP 'menu-in.txt'
          $out = Join-Path $env:RUNNER_TEMP 'menu-out.txt'
          Set-Content -LiteralPath $in -Value @('', '16', '', '16', '', '17', '', '13', '', '12', '', '0') -Encoding Ascii
          $p = Start-Process -FilePath cmd.exe -ArgumentList ('/c ""{0}""' -f (Join-Path $root 'Nova.cmd')) -RedirectStandardInput $in -RedirectStandardOutput $out -NoNewWindow -PassThru
          if (-not $p.WaitForExit(300000)) { & taskkill.exe /T /F /PID $p.Id | Out-Null; throw 'Menu walk hung.' }
          Write-Host ([IO.File]::ReadAllText($out))
          # The console output here is in the OEM code page; Nova's own log (transcript) keeps the real text.
          $log = Get-ChildItem -LiteralPath (Join-Path $env:ProgramData 'Nova\logs') -Filter 'nova-*.log' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $text = [IO.File]::ReadAllText($log.FullName, [Text.Encoding]::UTF8)
          $err = [regex]::Matches($text, '\u041e\u0448\u0438\u0431\u043a\u0430:').Count
          $gm = [regex]::Matches($text, '\u0420\u0415\u0416\u0418\u041c \u0418\u0413\u0420\u042b').Count
          $drv = [regex]::Matches($text, '\u0421\u0412\u0415\u0416\u0418\u0419 \u041b\u0418 \u0414\u0420\u0410\u0419\u0412\u0415\u0420').Count
          Write-Host "errors: $err, game mode screens: $gm, driver screens: $drv"
          if ($err -gt 0) { throw 'The menu showed an error.' }
          if ($gm -lt 2 -or $drv -lt 1) { throw 'Not every menu item opened.' }
          if (Get-ItemProperty -Path 'HKCU:\Software\Nova' -Name GameMode -ErrorAction SilentlyContinue) { throw 'Game mode stayed on after the menu walk.' }
          if (Test-Path -LiteralPath (Join-Path $env:ProgramData 'Nova\gamemode-updates.json')) { throw 'Update pause stayed on after the menu walk.' }

      - name: Сводка
        if: always()
        shell: pwsh
        run: if (Test-Path -LiteralPath $env:NOVA_SUMMARY) { Get-Content -LiteralPath $env:NOVA_SUMMARY -Encoding utf8 } else { 'no summary' }
