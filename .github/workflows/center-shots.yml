name: Снимки Nova Центра для сайта

# Когда меняется окно Nova Центр или Nova Голос, свежие снимки его страниц кладутся в docs/img/center — для сайта
# и чтобы посмотреть, как окно выглядит, не скачивая артефакты. Коммит с [skip ci] — проверки не перезапускаются.
on:
  push:
    branches: ['claude/hello-973j4n']
    paths:
      - 'src/NovaApp.ps1'
      - 'src/NovaVoiceApp.ps1'
      - 'assets/**'
      - '.github/workflows/center-shots.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: center-shots
  cancel-in-progress: true

jobs:
  shots:
    name: Снимки окна
    runs-on: windows-latest
    env:
      NOVA_ALLOW_SHARED_FOLDER: '1'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Снимки всех страниц
        shell: powershell
        run: |
          $png = Join-Path $env:RUNNER_TEMP 'center'
          ./src/NovaApp.ps1 -Screenshot $png
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./src/NovaVoiceApp.ps1 -Screenshot $png
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Type -AssemblyName System.Drawing
          $out = Join-Path (Get-Location) 'docs\img\center'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $codec = [System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object { $_.MimeType -eq 'image/jpeg' }
          $ep = New-Object System.Drawing.Imaging.EncoderParameters 1
          $ep.Param[0] = New-Object System.Drawing.Imaging.EncoderParameter ([System.Drawing.Imaging.Encoder]::Quality), 86L
          foreach ($f in Get-ChildItem -LiteralPath $png -Filter '*.png') {
            $img = [System.Drawing.Image]::FromFile($f.FullName)
            $img.Save((Join-Path $out ($f.BaseName + '.jpg')), $codec, $ep); $img.Dispose()
          }
          Get-ChildItem -LiteralPath $out | ForEach-Object { '{0}  {1:N0}' -f $_.Name, $_.Length }

      - name: Положить снимки в ветку
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/img/center
          git diff --cached --quiet && exit 0
          git commit -m "Снимки Nova Центра [skip ci]"
          for i in 1 2 3; do git pull --rebase origin claude/hello-973j4n && git push origin HEAD:claude/hello-973j4n && exit 0; sleep 5; done
          exit 1
